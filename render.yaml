services:
  - type: web
    runtime: node
    name: ailhong-api
    region: singapore
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    healthCheckPath: /health/live
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: REFRESH_COOKIE_SAME_SITE
        value: none
      - key: AI_ENABLED
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
